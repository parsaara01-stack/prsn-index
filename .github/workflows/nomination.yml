name: Nomination approved

# Add the `approved` label to a nomination issue (only maintainers can) and this adds the leader to the directory,
# and to the index's screening universe if the company is public, then rebuilds the site.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  add:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'nomination')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Add to the directory
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python -m engine.intake > result.json 2> error.txt || { echo "failed=1" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "failed=0" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: steps.add.outputs.failed == '0'
        env:
          N: ${{ github.event.issue.number }}
        run: |
          git config user.name "prsn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/directory engine/config/universe.csv
          git commit -m "directory: add nomination #$N"
          git pull --rebase origin main
          git push
      - name: Reply and rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
          FAILED: ${{ steps.add.outputs.failed }}
        run: |
          if [ "$FAILED" = "1" ]; then
            gh issue comment "$N" --body "Couldn't add this automatically: $(tail -1 error.txt). Edit the issue and re-apply the label."
            gh issue edit "$N" --remove-label approved
          else
            gh issue comment "$N" --body "Added to the PRSN directory. Public companies join the weekly screen too. Thank you!"
            gh issue close "$N"
            gh workflow run prsn.yml -f step=daily
          fi

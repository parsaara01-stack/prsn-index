<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PRSN — Persian-Led US Equity Index (v3)</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="PRSN: a rules-based US equity index of companies led by a CEO, co-CEO, or executive chair of Persian or Iranian heritage, built on a high-conviction compounder and catalyst architecture.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap">
<style>
:root {
  --page: #F6F5F1;
  --surface: #FFFFFF;
  --navy: #14264B;
  --fg: #121C2B;
  --silver: #4A5568;
  --dim: #647082;
  --line: #D8DEE6;
  --line-strong: #121C2B;
  --gain: #157535;
  --loss: #B92B24;
  --f-serif: "Newsreader", Georgia, "Times New Roman", serif;
  --f-display: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --f-data: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { background: var(--page); scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; padding: 0; background: var(--page); color: var(--fg); font-family: var(--f-display); font-size: 14px; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
[hidden]:not([hidden=until-found i]) { display: none !important; }
.serif { font-family: var(--f-serif); }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; letter-spacing: -0.015em; }
.surface { background: var(--surface); border: 1px solid var(--line); }
.recharts-wrapper, .recharts-surface { outline: none; }
::selection { background: rgba(20, 38, 75, .14); }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; border-radius: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { fg: "#121C2B", silver: "#4A5568", dim: "#647082", accent: "#14264B", emerald: "#157535", coral: "#B92B24", surface: "#FFFFFF", page: "#F6F5F1", line: "#D8DEE6" },
      fontFamily: { serif: ["Newsreader", "Georgia", "serif"], display: ["Inter", "-apple-system", "BlinkMacSystemFont", "system-ui", "sans-serif"], mono: ["JetBrains Mono", "SF Mono", "ui-monospace", "monospace"] }
    }
  }
};
</script>
</head>
<body>
<div id="root"><div style="padding:48px 20px;color:#647082;font:14px Inter,sans-serif">Loading PRSN tear sheet…</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="app.js"></script>
</body>
</html>

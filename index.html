<title>PRSN Index</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
/* Layout: white cards on a pale page, navy type, Iran flag green for PRSN and red for the S&P 500. */
:root {
  --page: #F7F9FC;
  --surface: #FFFFFF;
  --navy: #14264B;
  --fg: #17243A;
  --silver: #536277;
  --dim: #66748A;
  --line: #E2E8F0;
  --gain: #178A3E;
  --loss: #C8322B;
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
  --f-data: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--fg); font-family: var(--f-display); -webkit-font-smoothing: antialiased; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.surface { background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(23, 36, 58, .04); }
.recharts-wrapper, .recharts-surface { outline: none; }
::selection { background: rgba(20, 38, 75, .14); }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { fg: "#17243A", silver: "#536277", dim: "#66748A", accent: "#14264B", emerald: "#178A3E", coral: "#C8322B", surface: "#FFFFFF", page: "#F7F9FC", line: "#E2E8F0" },
      fontFamily: { display: ["-apple-system", "BlinkMacSystemFont", "SF Pro Display", "Inter", "system-ui", "sans-serif"], mono: ["SF Mono", "JetBrains Mono", "ui-monospace", "monospace"] }
    }
  }
};
</script>
